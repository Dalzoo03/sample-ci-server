name: Likelion CI Test
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ec2-user
      EC2_DIR: sample-server
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      - name: Copy files to EC2
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" "mkdir -p ~/$EC2_DIR"
          scp -i ~/.ssh/ec2.pem -r \
            dist \
            package.json \
            package-lock.json \
            tsconfig.json \
            tsconfig.build.json \
            "$EC2_USER@$EC2_HOST:~/$EC2_DIR"
      - name: Restart app on EC2
        run: |
          ssh -i ~/.ssh/ec2.pem -T "$EC2_USER@$EC2_HOST" <<EOF
          set -e
          cd ~/$EC2_DIR
          npm ci --omit=dev
          if pm2 describe sample-server >/dev/null 2>&1; then
            pm2 restart sample-server
          else
            pm2 start dist/main.js --name "sample-server"
          fi
          pm2 save
          EOF
      - run: echo "This job's status is ${{ job.status }}."
