name: Node.js CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push Docker image
        run: |
          # buildx 설정
          docker buildx create --name mybuilder --use
          docker buildx inspect --bootstrap

          # 멀티 플랫폼 빌드 및 푸시
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t 380906050529.dkr.ecr.ap-northeast-2.amazonaws.com/sample-server:v2 \
            --push .

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Create SSH directory
        run: mkdir -p ~/.ssh

      - name: Add SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add EC2 host to known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ec2-user
        run: |
          ssh -i ~/.ssh/id_rsa $EC2_USERNAME@$EC2_HOST "
            set -e
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin 380906050529.dkr.ecr.ap-northeast-2.amazonaws.com
            docker pull 380906050529.dkr.ecr.ap-northeast-2.amazonaws.com/sample-server:v2
            docker stop sample-server || true
            docker rm sample-server || true
            docker run -d --restart unless-stopped --name sample-server -p 3000:3000 380906050529.dkr.ecr.ap-northeast-2.amazonaws.com/sample-server:v2

            # 이전 이미지 정리
            docker image prune -a -f
          "
